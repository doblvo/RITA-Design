<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RITA Design System</title><link rel="stylesheet" href="../tokens/tokens.css"><style>
body{margin:0;background:var(--rita-color-ice);color:var(--rita-color-text-primary);font:14px/1.35 var(--rita-font-ui)}main{width:min(1120px,calc(100% - 32px));margin:auto;padding:48px 0}h1,h2{font-family:var(--rita-font-display);letter-spacing:-.04em}.hero{display:grid;gap:12px;padding:32px;border-radius:var(--rita-radius-hero);background:var(--rita-color-glacier);color:#fff}.hero p{max-width:60ch;color:#d8f4f1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:20px}.card{padding:20px;border:1px solid var(--rita-color-border);border-radius:var(--rita-radius-card);background:#fff;box-shadow:var(--rita-shadow-soft)}.code{font-family:var(--rita-font-mono);font-weight:700}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{display:grid;gap:6px;font-size:11px}.swatch i{display:block;width:48px;height:48px;border-radius:8px}button{min-height:44px;padding:0 16px;border:0;border-radius:8px;font-weight:700}.primary{background:#075f62;color:#fff}.secondary{border:1px solid #bac5c5;background:#fff;color:#101718}.status{display:inline-flex;gap:6px;padding:6px 9px;border-radius:999px;background:#fff4d9;color:#835005;font-weight:700;font-size:12px}</style></head>
<body><main><section class="hero"><small>RITA / FIELD OPERATIONS</small><h1>Diseñar para el trabajo real.</h1><p>Showcase sin dependencias para revisar tokens, densidad, estados y componentes.</p><div><button class="primary">Buscar unidad</button> <button class="secondary">Ver tokens</button></div></section><section class="grid"><article class="card"><h2>Paleta</h2><div class="swatches"><span class="swatch"><i style="background:#075f62"></i>Glacier</span><span class="swatch"><i style="background:#129a9a"></i>Bright</span><span class="swatch"><i style="background:#b96d3d"></i>Copper</span><span class="swatch"><i style="background:#101718"></i>Ink</span></div></article><article class="card"><h2>Unidad</h2><p class="code">MSCU1234567</p><span class="status">◷ Pendiente de envío</span></article><article class="card"><h2>Dominio</h2><p><strong style="color:#075f62">CEDEX</strong> · <strong style="color:#b96d3d">Repuestos</strong> · <strong style="color:#129a9a">PTI</strong></p></article></section></main></body></html>
